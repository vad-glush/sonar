version: '3'
services:
  sonarqube:
    build:
      context: .
      dockerfile: Dockerfile.sonarqube-lts
    container_name: sonarqube-local
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - sonar.es.bootstrap.checks.disable=true
      - sonar.jdbc.username=sonar
      - sonar.jdbc.password=sonar
      - sonar.jdbc.url=jdbc:postgresql://sonarqube-postgres:5432/sonar
      - SONAR_WEB_JAVAADDITIONALOPTS=-javaagent:./extensions/plugins/sonarqube-community-branch-plugin-1.13.0.jar=web
      - SONAR_CE_JAVAADDITIONALOPTS=-javaagent:./extensions/plugins/sonarqube-community-branch-plugin-1.13.0.jar=ce
    volumes:
      - sonar_data:/opt/sonarqube/data:rw
      - sonar_conf:/opt/sonarqube/conf:rw
      - sonar_logs:/opt/sonarqube/logs:rw
      - sonar_ext:/opt/sonarqube/extensions:rw
    ports:
      - "9000:9000"
    networks:
      - sonarnet
    restart: always
    depends_on:
      - sonarqube-postgres
  sonarqube-postgres:
    image: postgres:15.6
    container_name: sonarqube-postgres-local
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonar_data_db:/var/lib/postgresql/data:rw
    networks:
      - sonarnet
    restart: always
networks:
  sonarnet:
    driver: bridge
volumes:
  sonar_data:
  sonar_conf:
  sonar_logs:
  sonar_ext:
  sonar_data_db:
