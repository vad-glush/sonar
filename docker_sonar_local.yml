version: '2'

services:

  sonarqube:
    image: sonarqube:25.8.0.112029-community
    #image: sonarqube:24.12.0.100206-community
    # image: sonarqube:10.6.0-community
    #image: sonarqube:9.9.8-community
    container_name: sonarqube
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - sonar.es.bootstrap.checks.disable=true
      - sonar.jdbc.username=sonar
      - sonar.jdbc.password=sonar
      - sonar.jdbc.url=jdbc:postgresql://sonarqube-postgres:5432/sonar?defaultRowFetchSize=100&reWriteBatchedInserts=true&autosave=always
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-postgres:5432/sonar?defaultRowFetchSize=100&reWriteBatchedInserts=true&autosave=always
#      - SONAR_WEB_JAVAADDITIONALOPTS=-javaagent:./extensions/plugins/sonarqube-community-branch-plugin-25.7.0.jar=web
#      - SONAR_CE_JAVAADDITIONALOPTS=-javaagent:./extensions/plugins/sonarqube-community-branch-plugin-25.7.0.jar=ce
# Оптимизация памяти
       # МАКСИМАЛЬНАЯ память
      - SONAR_WEB_JAVAOPTS=-Xmx10g -Xms4g -XX:+HeapDumpOnOutOfMemoryError
      - SONAR_CE_JAVAOPTS=-Xmx2g -Xms1g
      - SONAR_SEARCH_JAVAOPTS=-Xmx2g -Xms512m -XX:MaxDirectMemorySize=256m
      # Увеличиваем таймауты для индексации
      - sonar.es.requestTimeout=120s
      - sonar.es.connectionTimeout=60s
      # Увеличиваем таймаут для операций с базой данных
      - sonar.jdbc.connectTimeout=60000
      - sonar.jdbc.socketTimeout=600000
    volumes:
      - sonar_datax:/opt/sonarqube/data:rw
      - sonar_conf:/opt/sonarqube/conf:rw
      - sonar_logs:/opt/sonarqube/logs:rw
      - sonar_ext:/opt/sonarqube/extensions:rw
    ports:
      - "9000:9000"
    networks:
      - sonarnet
    extra_hosts:
      - "ibpsoft:192.168.7.222"
    restart: always
    depends_on:
      - sonarqube-postgres

  sonarqube-postgres:
    image: postgres:15.6
    container_name: sonarqube-postgres
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
      - POSTGRES_RANDOM_PAGE_COST=1.1
      # Критически важные настройки для больших нагрузок
      - POSTGRES_MAX_LOCKS_PER_TRANSACTION=256
      - POSTGRES_MAX_CONNECTIONS=300
      - POSTGRES_SHARED_BUFFERS=2GB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=4GB
      - POSTGRES_WORK_MEM=64MB
      - POSTGRES_MAINTENANCE_WORK_MEM=1GB
      # Дополнительные настройки для стабильности
      - POSTGRES_MAX_WAL_SIZE=2GB
      - POSTGRES_MIN_WAL_SIZE=1GB
    volumes:
      - sonar_data_db:/var/lib/postgresql/data:rw
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      - sonarnet
    restart: always

networks:
  sonarnet:
    driver: bridge

volumes:
  sonar_datax:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/Users/macbook/Documents/TMP_SONAR/data/data/'
  sonar_conf:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/Users/macbook/Documents/TMP_SONAR/data/conf/'
  sonar_logs:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/Users/macbook/Documents/TMP_SONAR/data/logs/'
  sonar_ext:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/Users/macbook/Documents/TMP_SONAR/data/extensions/'
  sonar_data_db:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/Users/macbook/Documents/TMP_SONAR/db15/'
