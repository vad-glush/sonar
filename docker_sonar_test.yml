version: '3'
services:
  sonarqube:
    image: sonarqube:9.9.8-community
    container_name: sonarqube-test
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
      - sonar.es.bootstrap.checks.disable=true
      - sonar.jdbc.username=sonar
      - sonar.jdbc.password=sonar
      - sonar.jdbc.url=jdbc:postgresql://sonarqube-postgres:5432/sonar
    volumes:
      - sonar_data_test:/opt/sonarqube/data:rw
      - sonar_conf_test:/opt/sonarqube/conf:rw
      - sonar_logs_test:/opt/sonarqube/logs:rw
      - sonar_ext_test:/opt/sonarqube/extensions:rw
    ports:
      - "9000:9000"
    networks:
      - sonarnet
    restart: always
    depends_on:
      - sonarqube-postgres
  sonarqube-postgres:
    image: postgres:15.6
    container_name: sonarqube-postgres-test
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonar_data_db_test:/var/lib/postgresql/data:rw
    networks:
      - sonarnet
    restart: always
networks:
  sonarnet:
    driver: bridge
volumes:
  sonar_data_test:
  sonar_conf_test:
  sonar_logs_test:
  sonar_ext_test:
  sonar_data_db_test:
