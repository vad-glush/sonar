version: '3'

services:
  sonarqube:
    image: sonarqube:9.9.8-community
    container_name: sonarqube-basic-9
    environment:
      - sonar.jdbc.username=sonar
      - sonar.jdbc.password=sonar
      - sonar.jdbc.url=jdbc:postgresql://sonarqube-postgres:5432/sonar
    volumes:
      - sonar_data_basic_9:/opt/sonarqube/data:rw
    ports:
      - "9000:9000"
    depends_on:
      - sonarqube-postgres
    networks:
      - sonarnet

  sonarqube-postgres:
    image: postgres:15.6
    container_name: sonarqube-postgres-basic-9
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonar_data_db_basic_9:/var/lib/postgresql/data:rw
    networks:
      - sonarnet

volumes:
  sonar_data_basic_9:
  sonar_data_db_basic_9:

networks:
  sonarnet:
    driver: bridge
